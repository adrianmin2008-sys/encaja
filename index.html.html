<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encaja: la pieza exacta, a la primera</title>
<meta name="description" content="Tómale una foto a la pieza que se dañó: Encaja te dice qué es, si encaja en tu auto y dónde está mejor de precio cerca de ti.">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090D0B" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
<style>
:root{color-scheme:light;
--bg:#F3F5F4;--surface:#FFFFFF;--surface-2:#EDF1EE;--surface-3:#E2E8E4;
--ink:#0D1411;--ink-2:#36423D;--ink-3:#62706A;--ink-4:#95A19B;
--line:#E0E6E2;--line-2:#C9D2CD;
--brand:#0A7A54;--brand-hover:#086747;--brand-ink:#FFFFFF;--brand-soft:#E1F2E9;--brand-2:#18B57B;--deep:#06291D;
--amber:#955800;--amber-soft:#FFF1D4;--red:#C1372C;--red-soft:#FCEAE8;
--glass:rgba(250,251,250,.78);--glass-line:rgba(13,20,17,.08);--tile:#EDF2EE;
--shadow-1:0 1px 2px rgba(13,20,17,.05);
--shadow-2:0 22px 44px -22px rgba(13,20,17,.38),0 2px 8px -2px rgba(13,20,17,.08);
--mono-l:92%;--mono-s:42%;--mono-t:26%;
--font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,.9,.25,1.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#090D0B;--surface:#111815;--surface-2:#17201C;--surface-3:#212C27;--ink:#ECF2EF;--ink-2:#C1CCC7;--ink-3:#8C9993;--ink-4:#62706A;--line:#1D2723;--line-2:#2D3934;--brand:#2BC186;--brand-hover:#45D198;--brand-ink:#03140C;--brand-soft:rgba(43,193,134,.13);--brand-2:#46E0A2;--deep:#04170F;--amber:#F0B24A;--amber-soft:rgba(240,178,74,.12);--red:#FF8A7D;--red-soft:rgba(255,138,125,.12);--glass:rgba(13,19,16,.76);--glass-line:rgba(255,255,255,.07);--tile:#17201C;--shadow-1:0 1px 2px rgba(0,0,0,.5);--shadow-2:0 22px 44px -22px rgba(0,0,0,.85);--mono-l:20%;--mono-s:26%;--mono-t:78%}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#090D0B;--surface:#111815;--surface-2:#17201C;--surface-3:#212C27;--ink:#ECF2EF;--ink-2:#C1CCC7;--ink-3:#8C9993;--ink-4:#62706A;--line:#1D2723;--line-2:#2D3934;--brand:#2BC186;--brand-hover:#45D198;--brand-ink:#03140C;--brand-soft:rgba(43,193,134,.13);--brand-2:#46E0A2;--deep:#04170F;--amber:#F0B24A;--amber-soft:rgba(240,178,74,.12);--red:#FF8A7D;--red-soft:rgba(255,138,125,.12);--glass:rgba(13,19,16,.76);--glass-line:rgba(255,255,255,.07);--tile:#17201C;--shadow-1:0 1px 2px rgba(0,0,0,.5);--shadow-2:0 22px 44px -22px rgba(0,0,0,.85);--mono-l:20%;--mono-s:26%;--mono-t:78%}
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;letter-spacing:-.008em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px)}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul,ol,figure{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.i{width:22px;height:22px;flex:none}
/* ---------- Barra superior ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid var(--glass-line)}
.bar__in{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:60px;padding:0 12px 0 14px}
.logo{display:inline-flex;align-items:center;gap:9px;padding:0;border:0;background:none;color:var(--ink);text-decoration:none}
.logo__m{width:30px;height:30px;flex:none}
.logo__w{font-size:22px;line-height:1;font-weight:700;letter-spacing:-.055em}
.bar__title{min-width:0;font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar__nav{display:none}
.bar__trail{display:flex;align-items:center;gap:6px;margin-left:auto}
.iconbtn{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:13px;background:transparent;color:var(--ink);transition:background-color .15s}
.iconbtn:hover{background:var(--surface-2)}
.vchip{display:inline-flex;align-items:center;gap:7px;max-width:200px;min-height:38px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;transition:border-color .15s}
.vchip:hover{border-color:var(--ink-4)}
.vchip .i{width:19px;height:19px;color:var(--brand)}
.vchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vchip--empty{border-style:dashed;color:var(--brand)}
.sinput{flex:1;display:flex;align-items:center;gap:8px;min-width:0;height:44px;padding:0 12px;border-radius:13px;background:var(--surface-2)}
.sinput .i{width:20px;height:20px;color:var(--ink-3)}
.sinput input{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.sinput input::placeholder{color:var(--ink-4)}
.sinput input::-webkit-search-cancel-button{-webkit-appearance:none}
/* ---------- Estructura ---------- */
.view{max-width:1160px;margin:0 auto;padding:14px 16px 132px;outline:none}
.view.is-in{animation:vin .32s var(--ease) both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.display{font-size:clamp(36px,10vw,64px);line-height:1;font-weight:700;letter-spacing:-.055em;text-wrap:balance}
.lede{margin-top:14px;max-width:38ch;font-size:17px;line-height:1.5;color:var(--ink-3)}
.h1{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.045em}
.h2{font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.035em}
.sub{font-size:14px;color:var(--ink-3)}
.sec{margin-top:34px}
.sec__head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.link{display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--brand);font-size:14.5px;font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link .i{width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px}
/* ---------- Botones ---------- */
.btn{--h:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h);padding:0 20px;border-radius:15px;border:1px solid transparent;background:var(--surface-2);color:var(--ink);font-size:15.5px;font-weight:600;letter-spacing:-.012em;white-space:nowrap;text-decoration:none;user-select:none;transition:transform .12s var(--ease),background-color .15s,border-color .15s}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn .i{width:20px;height:20px;margin-left:-2px}
.btn--brand{background:var(--brand);color:var(--brand-ink)}
.btn--brand:hover{background:var(--brand-hover)}
.btn--line{background:var(--surface);border-color:var(--line-2)}
.btn--line:hover{border-color:var(--ink-4)}
.btn--white{background:#fff;color:#0A7A54}
.btn--white:hover{background:#F2FBF6}
.btn--glass{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.24);color:#fff}
.btn--glass:hover{background:rgba(255,255,255,.17)}
.btn--sm{--h:40px;padding:0 15px;font-size:14.5px;border-radius:13px}
.btn--lg{--h:56px;padding:0 22px;font-size:16.5px;border-radius:17px}
.btn--block{display:flex;width:100%}
/* ---------- Inicio ---------- */
.hero{display:grid;gap:22px;padding-top:10px}
.scan{position:relative;isolation:isolate;overflow:hidden;min-height:268px;padding:26px 22px 22px;border-radius:30px;background:radial-gradient(130% 120% at 100% 0%,#0F6345 0%,#083828 46%,var(--deep) 100%);color:#fff;box-shadow:var(--shadow-2)}
.scan__art{position:absolute;inset:0;z-index:-1;pointer-events:none}
.scan__art img{position:absolute;filter:drop-shadow(0 14px 18px rgba(0,0,0,.4))}
.scan__t{max-width:9ch;font-size:31px;line-height:1.04;font-weight:700;letter-spacing:-.05em}
.scan__d{margin-top:10px;max-width:19ch;font-size:15px;line-height:1.45;color:#B4DAC8}
.scan__acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.scan__demo{margin-top:16px;font-size:14px;color:#A6D4BF}
.scan__demo button{padding:0;border:0;background:none;color:#fff;font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.searchbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 18px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);font-size:16px;text-align:left;box-shadow:var(--shadow-1);transition:border-color .15s}
.searchbtn:hover{border-color:var(--line-2)}
.searchbtn .i{color:var(--ink-2)}
.cats{display:grid;grid-auto-flow:column;grid-auto-columns:106px;gap:10px;margin:0 -16px;padding:2px 16px 6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:grid;justify-items:center;gap:6px;padding:12px 6px 13px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;letter-spacing:-.01em;scroll-snap-align:start;transition:border-color .15s,transform .15s var(--ease)}
.cat:hover{border-color:var(--line-2);transform:translateY(-1px)}
.cat img{width:66px;height:66px}
.rows{display:grid;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--surface)}
.prow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 12px;border:0;background:none;color:var(--ink);text-align:left;transition:background-color .15s}
.prow + .prow{border-top:1px solid var(--line)}
.prow:hover{background:var(--surface-2)}
.prow__art{display:grid;place-items:center;width:60px;height:60px;flex:none;border-radius:17px;background:var(--tile)}
.prow__art img{width:48px;height:48px}
.prow__t{display:grid;gap:2px;flex:1;min-width:0}
.prow__n{font-size:15.5px;font-weight:600;letter-spacing:-.015em}
.prow__s{font-size:13.5px;color:var(--ink-3)}
.prow__fit{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--brand)}
.prow__fit .i{width:15px;height:15px}
.prow__p{text-align:right;white-space:nowrap;font-size:16px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.prow__p small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}
.tcard__i{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;background:var(--brand-soft);color:var(--brand)}
.tcard b{display:block;font-size:15px;line-height:1.3;letter-spacing:-.015em}
.tcard div > span{font-size:12.5px;line-height:1.35;color:var(--ink-3)}
.foot{margin-top:30px;font-size:12.5px;color:var(--ink-4);text-align:center}
/* ---------- Buscar ---------- */
.chips{display:flex;gap:8px;margin:0 -16px;padding:2px 16px 14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;transition:background-color .15s,border-color .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.empty{display:grid;justify-items:center;gap:12px;padding:44px 20px;text-align:center}
.empty img{width:120px;opacity:.9}
.empty p{max-width:30ch;color:var(--ink-3)}
/* ---------- Revisar foto ---------- */
.review{display:grid;gap:14px}
.stage{position:relative;overflow:hidden;aspect-ratio:1/1;max-height:62svh;width:100%;border-radius:30px;background:#0B110E}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cor{position:absolute;z-index:2;width:34px;height:34px;border:0 solid #4BE3A8;pointer-events:none}
.cor--tl{top:16px;left:16px;border-top-width:3px;border-left-width:3px;border-top-left-radius:14px}
.cor--tr{top:16px;right:16px;border-top-width:3px;border-right-width:3px;border-top-right-radius:14px}
.cor--bl{bottom:16px;left:16px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:14px}
.cor--br{bottom:16px;right:16px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:14px}
.sweep{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(75,227,168,.22) 84%,#4BE3A8 84%,#4BE3A8 calc(84% + 2px),transparent calc(84% + 2px)) 0 -140px/100% 140px no-repeat}
.stage.is-scanning .sweep{opacity:1;animation:sweep 1.7s cubic-bezier(.45,0,.55,1) infinite}
.stage.is-scanning img{filter:saturate(.8) brightness(.9)}
@keyframes sweep{from{background-position:0 -140px}to{background-position:0 calc(100% + 140px)}}
.thumbs{display:flex;align-items:center;gap:10px}
.thumb{width:62px;height:62px;flex:none;overflow:hidden;padding:0;border-radius:17px;border:2px solid transparent;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb[aria-pressed="true"]{border-color:var(--brand)}
.thumb--add{display:grid;place-items:center;border:1.5px dashed var(--line-2);color:var(--ink-3)}
.thumbs__h{font-size:13.5px;color:var(--ink-3)}
.field{display:grid;gap:6px;padding:18px}
.field__l{font-size:15px;font-weight:650;letter-spacing:-.015em}
.field__h{font-size:13.5px;color:var(--ink-3)}
.input{width:100%;min-height:52px;margin-top:6px;padding:0 15px;border-radius:15px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--ink-4)}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}
.vrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left}
.vrow__i{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;background:var(--brand-soft);color:var(--brand)}
.vrow b{display:block;font-size:15px;font-weight:650;letter-spacing:-.015em}
.vrow > span > span{font-size:13.5px;color:var(--ink-3)}
.vrow > .i:last-child{margin-left:auto;width:18px;height:18px;color:var(--ink-4)}
.steps{display:grid;gap:14px;padding:20px}
.step{display:flex;align-items:center;gap:12px;font-size:15.5px;color:var(--ink-4);transition:color .2s}
.step__d{display:grid;place-items:center;width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line-2);color:#fff}
.step__d .i{width:15px;height:15px;stroke-width:2.6}
.step.is-now{color:var(--ink);font-weight:600}
.step.is-now .step__d{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.step.is-done{color:var(--ink-2)}
.step.is-done .step__d{border-color:var(--brand);background:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}
.note{display:flex;gap:10px;padding:14px 16px;border-radius:18px;font-size:14px;line-height:1.5}
.note .i{width:19px;height:19px;margin-top:1px}
.note--warn{background:var(--amber-soft);color:var(--amber)}
/* ---------- Resultado ---------- */
.res{display:grid;gap:30px}
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match--one{grid-template-columns:1fr}
.mf{position:relative;overflow:hidden;aspect-ratio:1;border-radius:26px;background:var(--tile)}
.match--one .mf{aspect-ratio:16/10}
.mf img{width:100%;height:100%;object-fit:cover}
.mf--art img{object-fit:contain;padding:13%}
.mf figcaption{position:absolute;left:10px;bottom:10px;padding:4px 10px;border-radius:999px;background:rgba(13,20,17,.6);color:#fff;font-size:12px;font-weight:600;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ring{position:absolute;left:50%;top:50%;z-index:2;display:grid;place-items:center;width:92px;height:92px;border-radius:50%;background:var(--surface);transform:translate(-50%,-50%);box-shadow:0 14px 28px -12px rgba(13,20,17,.5),0 0 0 6px var(--bg)}
.ring svg{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);transform:rotate(-90deg)}
.ring__t{position:relative;display:grid;justify-items:center;line-height:1}
.ring__v{font-size:23px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.ring__l{margin-top:3px;font-size:10px;font-weight:600;color:var(--ink-3);letter-spacing:.01em}
.ring__arc{transition:stroke-dashoffset 1s var(--ease)}
.pname{margin-top:20px;font-size:clamp(29px,8vw,40px);line-height:1.04;font-weight:700;letter-spacing:-.05em;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:0 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:600}
.fit{display:flex;align-items:flex-start;gap:12px;width:100%;margin-top:18px;padding:15px 16px;border:0;border-radius:22px;background:var(--surface-2);color:var(--ink);text-align:left}
.fit__i{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;background:var(--ink-4);color:#fff}
.fit__i .i{width:20px;height:20px;stroke-width:2.4}
.fit b{display:block;font-size:16px;line-height:1.3;letter-spacing:-.02em}
.fit div > span{display:block;margin-top:2px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.fit > .i:last-child{margin:8px 0 0 auto;width:18px;height:18px;color:var(--ink-3)}
.fit--yes{background:var(--brand-soft)}.fit--yes .fit__i{background:var(--brand)}
.fit--no{background:var(--red-soft)}.fit--no .fit__i{background:var(--red)}
.fit--warn{background:var(--amber-soft)}.fit--warn .fit__i{background:var(--amber)}
.why{margin-top:14px;font-size:15px;line-height:1.55;color:var(--ink-2)}
.checks{margin-top:18px;overflow:hidden}
.checks__h{padding:16px 18px 6px}
.checks__h b{display:block;font-size:16px;letter-spacing:-.02em}
.checks__h span{font-size:13.5px;color:var(--ink-3)}
.ck{display:flex;align-items:center;gap:12px;width:100%;padding:12px 18px;border:0;background:none;color:var(--ink);font-size:15px;line-height:1.4;text-align:left}
.ck + .ck{border-top:1px solid var(--line)}
.ck__b{display:grid;place-items:center;width:26px;height:26px;flex:none;border-radius:9px;border:2px solid var(--line-2);color:transparent;transition:background-color .15s,border-color .15s,color .15s}
.ck__b .i{width:16px;height:16px;stroke-width:2.8}
.ck[aria-pressed="true"] .ck__b{border-color:var(--brand);background:var(--brand);color:#fff}
.ck[aria-pressed="true"] > span:last-child{color:var(--ink-3)}
.checks__ok{display:flex;align-items:center;gap:8px;padding:12px 18px 16px;font-size:14px;font-weight:600;color:var(--brand)}
.ask{margin-top:18px;padding:18px}
.ask b{display:block;font-size:16px;letter-spacing:-.02em}
.ask p{margin-top:4px;font-size:15px;color:var(--ink-2)}
.ask__o{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.alts{margin-top:18px}
.alts__h{font-size:14px;color:var(--ink-3)}
.alts__l{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.alt{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 6px 0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600}
.alt small{padding:3px 8px;border-radius:999px;background:var(--surface-2);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.disc{display:flex;gap:9px;margin-top:20px;font-size:13px;line-height:1.5;color:var(--ink-3)}
.disc .i{width:17px;height:17px;margin-top:1px}
.price{padding:20px}
.price__h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.price__h b{font-size:16px;letter-spacing:-.02em}
.price__big{margin-top:6px;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.price__big small{margin-left:6px;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink-3)}
.range{position:relative;height:10px;margin:22px 4px 0;border-radius:999px;background:linear-gradient(90deg,var(--brand-2),#E7C14B 55%,#E5806F)}
.range__avg{position:absolute;top:-6px;width:2px;height:22px;margin-left:-1px;border-radius:2px;background:var(--ink)}
.range__dot{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 4px var(--brand),0 4px 10px rgba(13,20,17,.25)}
.range__l{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.range__l b{color:var(--ink);font-weight:600}
.price__tip{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--brand)}
.price__tip .i{width:19px;height:19px}
.offers{margin-top:26px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin-bottom:12px;padding:3px;border-radius:14px;background:var(--surface-2)}
.seg button{min-height:38px;border:0;border-radius:11px;background:transparent;color:var(--ink-3);font-size:14px;font-weight:600;transition:background-color .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(13,20,17,.12),0 0 0 1px var(--line)}
.olist{display:grid;gap:10px}
.offer{position:relative;display:grid;gap:14px;padding:16px;border-radius:24px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s}
.offer--reco{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.offer__b{justify-self:start;display:inline-flex;align-items:center;gap:6px;margin-bottom:-4px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-size:12.5px;font-weight:650}
.offer__b .i{width:15px;height:15px}
.offer__top{display:flex;align-items:center;gap:12px}
.mono{display:grid;place-items:center;width:46px;height:46px;flex:none;border-radius:15px;background:hsl(var(--h) var(--mono-s) var(--mono-l));color:hsl(var(--h) 42% var(--mono-t));font-size:15px;font-weight:700;letter-spacing:-.03em}
.offer__id{flex:1;min-width:0}
.offer__id h3{font-size:16px;line-height:1.3;font-weight:650;letter-spacing:-.02em}
.offer__id h3 .i{display:inline-block;width:17px;height:17px;margin-left:4px;vertical-align:-3px;color:var(--brand)}
.offer__id p{font-size:13.5px;color:var(--ink-3)}
.offer__p{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.offer__p b{font-size:24px;line-height:1;font-weight:700;letter-spacing:-.045em}
.offer__p small{margin-left:3px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.offer__m{display:flex;flex-wrap:wrap;gap:6px}
.spec{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:550}
.spec i{width:7px;height:7px;border-radius:50%;background:var(--ink-4)}
.spec--open{background:var(--brand-soft);color:var(--brand)}
.spec--open i{background:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-2) 25%,transparent)}
.offer__a{display:flex;align-items:center;gap:8px}
.offer__f{display:inline-flex;align-items:center;gap:5px;margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.offer__f .i{width:15px;height:15px}
.locate{margin-top:14px}
.noprice{display:grid;justify-items:start;gap:10px;padding:22px}
.noprice p{color:var(--ink-3)}
/* ---------- Mi auto ---------- */
.gempty{display:grid;justify-items:center;gap:14px;padding:26px 8px 8px;text-align:center}
.gempty img{width:min(320px,90%)}
.gempty .lede{margin-top:0}
.gcard{display:grid;gap:4px;padding:18px 18px 20px;border-radius:30px;background:radial-gradient(130% 120% at 0% 0%,var(--brand-soft),var(--surface) 60%);border:1px solid var(--line)}
.gcard img{width:min(340px,100%);margin:0 auto 6px}
.gcard__r{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.gcard p{font-size:15px;color:var(--ink-3)}
/* ---------- Barra de acción y pestañas ---------- */
.cta,.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--glass-line)}
.cta{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.cta__in{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
.cta__t{flex:1;min-width:0}
.cta__t b{display:block;font-size:15px;line-height:1.3;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta__t span{display:block;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:6px 28px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:grid;justify-items:center;gap:2px;padding:6px 0 2px;border:0;background:none;color:var(--ink-4);font-size:11.5px;font-weight:600}
.tab .i{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--ink)}
.fab{display:grid;justify-items:center;gap:5px;margin-top:-30px;padding:0 6px;border:0;background:none;color:var(--ink);font-size:11.5px;font-weight:600}
.fab__c{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--brand);color:var(--brand-ink);box-shadow:0 12px 26px -8px rgba(10,122,84,.6),0 0 0 6px var(--bg);transition:transform .15s var(--spring)}
.fab:active .fab__c{transform:scale(.94)}
.fab__c .i{width:29px;height:29px}
/* ---------- Hojas ---------- */
.sheet{width:100%;max-width:560px;max-height:calc(100dvh - 20px);margin:auto auto 0;padding:0;border:0;border-radius:30px 30px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -24px 60px -24px rgba(0,0,0,.45)}
.sheet::backdrop{background:rgba(6,12,9,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet[open]{animation:sheetin .34s var(--spring) both}
@keyframes sheetin{from{transform:translateY(48px);opacity:.4}to{transform:none;opacity:1}}
.sheet__in{display:grid;gap:18px;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet__in::before{content:"";display:block;width:38px;height:5px;margin:0 auto 4px;border-radius:3px;background:var(--line-2)}
.sheet__h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet__h p{margin-top:2px;font-size:14px;color:var(--ink-3)}
.sheet__lbl{margin-bottom:8px;font-size:14px;font-weight:650;color:var(--ink-2)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bopt{min-height:46px;padding:0 8px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-size:14.5px;font-weight:600}
.bopt[aria-pressed="true"],.mopt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.mopts{display:flex;flex-wrap:wrap;gap:8px}
.mopt{min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14.5px;font-weight:600}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px;border-radius:18px;background:var(--surface-2)}
.stepper b{font-size:26px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stepper button{display:grid;place-items:center;width:52px;height:52px;border:0;border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(13,20,17,.1);font-size:26px;font-weight:500}
.rsum{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--surface-2)}
.rsum__art{display:grid;place-items:center;width:64px;height:64px;flex:none;border-radius:16px;background:var(--surface)}
.rsum__art img{width:52px;height:52px}
.rsum b{display:block;font-size:16px;letter-spacing:-.02em}
.rsum span{font-size:13.5px;color:var(--ink-3)}
.rmsg{padding:14px 16px;border-radius:18px;border:1px dashed var(--line-2);font-size:14px;line-height:1.55;color:var(--ink-2)}
/* ---------- Aviso ---------- */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:70;max-width:min(92vw,480px);padding:13px 18px;border-radius:16px;background:#0D1411;color:#fff;font-size:14.5px;font-weight:500;line-height:1.4;box-shadow:0 18px 40px -18px rgba(0,0,0,.6);opacity:0;transform:translate(-50%,12px);transition:opacity .2s var(--ease),transform .25s var(--spring);pointer-events:none}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
/* ---------- Escritorio ---------- */
@media (min-width:960px){
  .bar__in{min-height:68px;padding:0 28px}
  .bar__nav{display:flex;gap:4px;margin-left:22px}
  .bar__nav button{min-height:40px;padding:0 14px;border:0;border-radius:12px;background:none;color:var(--ink-3);font-size:15px;font-weight:600}
  .bar__nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
  .view{padding:28px 28px 120px}
  .tabs{display:none}
  .hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:40px;padding-top:24px}
  .scan{min-height:330px;padding:34px 32px 30px}
  .scan__t{font-size:38px}
  .cats{grid-auto-flow:row;grid-template-columns:repeat(9,minmax(0,1fr));margin:0;padding:0;overflow:visible}
  .rows--2{grid-template-columns:1fr 1fr}
  .rows--2 .prow:nth-child(2){border-top:0}
  .rows--2 .prow:nth-child(even){border-left:1px solid var(--line)}
  .trust{grid-template-columns:repeat(4,minmax(0,1fr))}
  .res{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:44px}
  .res__a{position:sticky;top:96px}
  .review{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start;gap:28px}
  .review__side{display:grid;gap:14px}
  .cta--wide .cta__in{max-width:1104px}
  .cta--result{display:none}
  .toast{bottom:32px}
}
@media (max-width:959px){.review__side{display:grid;gap:14px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.stage.is-scanning .sweep{background-position:0 50%}}
</style>

async function prep(file) {
  const bmp = await createImageBitmap(file); const max = 1280; const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height); if (bmp.close) bmp.close();
  const blob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.86)); return { blob, url: cv.toDataURL('image/jpeg', 0.82) };
}
let addingAngle = false;
async function onFile(file) {
  if (!file) return; if (file.type && !/^image\//.test(file.type)) { toast('Ese archivo no es una imagen.'); return; }
  try {
    const ph = await prep(file);
    if (addingAngle && S.view === 'review' && S.photos.length < 3) { S.photos.push(ph); S.shown = S.photos.length - 1; render(); }
    else { S.photos = [ph]; S.shown = 0; S.code = ''; S.note = ''; S.demo = false; S.result = null; S.checks = {}; go('review'); }

    `Identifica la pieza de ${S.photos.length > 1 ? 'estas fotos (son la misma pieza desde distintos ángulos)' : 'esta foto'}. Puede estar sucia, oxidada o gastada.`,

    '{"es_repuesto": true, "nombre": "nombre común en español", "categoria": "Frenos, Motor, Suspensión, Eléctrico, Filtros, Encendido, Refrigeración, Iluminación, Transmisión u Otro", "confianza": 0-100, "por_que": "una frase con los rasgos que viste", "verificar": ["tres rasgos concretos que el cliente pueda comprobar con la pieza en la mano: cantidades, formas o medidas aproximadas"], "alternativas": [{"nombre": "...", "confianza": 0-100}], "pregunta": {"texto": "la pregunta que más reduciría la duda", "opciones": ["opción", "opción"]}, "consejo_foto": "solo si la foto no deja identificar bien"}',

async function identify(extra) {
  if (!S.photos.length || S.analyzing) return;
  if (S.demo) return runDemo(true);
  if (!S.sample || !S.imagesOk) { toast('Aquí no está disponible la identificación con IA. Te mostramos un ejemplo.'); return startDemo(); }
  S.note = ''; S.analyzing = { step: 0 }; S.ctl = new AbortController(); render();

    const ai = normAI(raw);

    if (!S.analyzing) return;
    if (!ai.esRepuesto) { S.analyzing = null; S.note = ai.consejo || 'No parece una pieza de vehículo. Prueba con otra foto, más cerca y con buena luz.'; render(); return; }
    showResult(ai, 'ai');

    render();
  }
}

function startDemo() { S.photos = [{ url: demoPhoto(), blob: null }]; S.shown = 0; S.code = ''; S.note = ''; S.demo = true; S.result = null; S.checks = {}; if (S.view !== 'review') go('review'); else render(); setTimeout(() => runDemo(), reduce() ? 0 : 500); }

    <button class="btn btn--brand btn--lg btn--block" type="button" data-act="send">${ic('chat')}Enviar por WhatsApp</button>
    <p class="sub" style="text-align:center">Esta tienda es de ejemplo: en el prototipo no se envía nada.</p>`;
  const d = $('#sheet'); if (!d.open) d.showModal(); vibe(10);
}

/* ---------- Acciones ---------- */
let toastT = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('is-on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('is-on'), 3200); }
const ACT = {
  back, tab: (el) => { S.stack = []; S.view = el.dataset.v; render(); window.scrollTo(0, 0); },
  camera: () => { addingAngle = false; $('#fileCam').click(); }, gallery: () => { addingAngle = false; $('#fileGal').click(); },
  angle: () => { addingAngle = true; $('#fileCam').click(); }, demo: () => startDemo(),
  search: () => { S.query = ''; S.cat = ''; go('search'); }, cat: (el) => { S.query = ''; S.cat = el.dataset.cat; go('search'); },
  filter: (el) => { S.cat = el.dataset.cat === 'Todas' ? '' : el.dataset.cat; document.querySelectorAll('.chip[data-act="filter"]').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); $('#sres').innerHTML = searchList(); },
  part: (el) => { const p = PARTS.find((x) => x.id === el.dataset.id); if (!p) return; remember(p.id); S.result = { source: 'catalog', ai: null, part: p, photo: '' }; S.checks = {}; S.sort = 'reco'; go('part'); },
  shown: (el) => { S.shown = Number(el.dataset.i) || 0; render(); }, identify: () => identify(), cancel,
  check: (el) => { const i = Number(el.dataset.i); S.checks[i] = !S.checks[i]; vibe(6); render(); },
  answer: (el) => { const q = S.result && S.result.ai && S.result.ai.pregunta; if (S.result.source === 'demo' || !S.sample) { toast('Gracias. Con tu respuesta, la coincidencia sube.'); return; } go('review'); identify(`El cliente respondió a tu pregunta «${q ? q.texto : ''}»: ${el.dataset.a}.`); },
  alt: (el) => { const R = S.result; const a = R.ai.alternativas[Number(el.dataset.i)]; if (!a) return; const prev = { nombre: R.ai.nombre, confianza: R.ai.confianza }; const ai = Object.assign({}, R.ai, { nombre: a.nombre, confianza: a.confianza, verificar: [], pregunta: null, porQue: '', alternativas: [prev].concat(R.ai.alternativas.filter((x) => x !== a)) }); const part = matchPart(a.nombre); S.result = Object.assign({}, R, { ai, part }); if (part) remember(part.id); S.checks = {}; render(); window.scrollTo(0, 0); },
  sort: (el) => { S.sort = el.dataset.k; render(); },
  locate: () => { if (!navigator.geolocation) { toast('Tu navegador no comparte la ubicación.'); return; } navigator.geolocation.getCurrentPosition((p) => { S.pos = { lat: p.coords.latitude, lng: p.coords.longitude }; render(); toast('Listo: distancias desde donde estás.'); }, () => toast('No pudimos obtener tu ubicación. Revisa el permiso.'), { timeout: 10000, maximumAge: 300000 }); },
  reserve: (el) => openReserve(el.dataset.s), send: () => { toast('En el prototipo no se envía nada. En la versión real, se abre WhatsApp.'); },
  quote: () => toast('En el prototipo no se envían pedidos. En la versión real, las tiendas responden aquí.'),
  share: async () => { const R = S.result; if (!R) return; const p = R.part; const r = p ? recoOf(offersFor(p)) : null; const text = `${p ? p.name : R.ai.nombre}${r ? `: ${r.shop.name}, ${fmt.format(r.usd)} USD` : ''}. Lo encontré con Encaja.`; try { if (navigator.share) { await navigator.share({ title: 'Encaja', text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; } try { await navigator.clipboard.writeText(text); toast('Copiado para compartir.'); } catch (e) { toast(text); } },
  garage: () => openGarage(), close: () => $('#sheet').close(),
  gmake: (el) => { S.gd.make = el.dataset.v; S.gd.model = ''; renderGarage(); }, gmodel: (el) => { S.gd.model = el.dataset.v; renderGarage(); },
  gyear: (el) => { S.gd.year = clamp(S.gd.year + Number(el.dataset.d), 1980, new Date().getFullYear() + 1); renderGarage(); },
  gsave: () => { const g = S.gd; if (!g.make || !g.model) return; S.veh = { make: g.make, model: g.model, year: g.year, engine: g.engine || '' }; LS.set('veh', S.veh); $('#sheet').close(); vibe(10); render(); toast(`Listo: buscamos piezas para tu ${S.veh.model} ${S.veh.year}.`); },
};
document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); } });
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'sq') { S.query = t.value; const r = $('#sres'); if (r) r.innerHTML = searchList(); }
  else if (t.id === 'code') S.code = t.value.slice(0, 40);
  else if (t.id === 'gmodel') { S.gd.model = t.value.slice(0, 40); document.querySelectorAll('.mopt').forEach((b) => b.setAttribute('aria-pressed', 'false')); const s = document.querySelector('[data-act="gsave"]'); if (s) s.disabled = !(S.gd.make && S.gd.model); }
});
['fileCam', 'fileGal'].forEach((id) => $('#' + id).addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; onFile(f); }));
$('#sheet').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
document.addEventListener('paste', (e) => { const it = e.clipboardData && Array.from(e.clipboardData.items || []).find((i) => i.type && i.type.startsWith('image/')); const f = it && it.getAsFile(); if (f) { e.preventDefault(); onFile(f); } });
document.documentElement.style.setProperty('--desk-scan', window.matchMedia('(min-width: 960px)').matches ? 'inline-flex' : 'none');
window.matchMedia('(min-width: 960px)').addEventListener('change', (m) => document.documentElement.style.setProperty('--desk-scan', m.matches ? 'inline-flex' : 'none'));

/* ---------- Arranque ---------- */
render();
(async () => {
  const c = window.claude; if (!c || typeof c.use !== 'function') return;
  try { S.sample = await c.use('sample'); } catch (e) { S.sample = null; }
  if (S.sample && typeof S.sample.limits === 'function') { try { const L = await S.sample.limits(); S.imagesOk = !!(L && L.images); } catch (e) { S.imagesOk = false; } }
})();
})();

</script>
</body>
